# cargo-nextest profiles. Plain `cargo test` still works; nextest adds per-test
# timeouts and JUnit output, which the CI and canary workflows consume.

[profile.default]
slow-timeout = { period = "30s" }

# CI: unit + offline protocol tests. Live canaries are #[ignore] and skipped.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
report-name = "slug-mcp"

# Live canaries: every test hits a real upstream, so run them all even after a
# failure (the point is the full list of broken adapters) and kill any single
# call that hangs for over four minutes.
[profile.live]
fail-fast = false
retries = 0
# Four upstream calls at a time keeps us under NOAA and ERDDAP rate limits.
test-threads = 4
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.live.junit]
path = "junit.xml"
report-name = "slug-mcp-live"
