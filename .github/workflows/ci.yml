name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the Fly deploy workflow (on deploy/flyio) gate on this: `uses: ./.github/workflows/ci.yml`.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            flags: ""
          - name: public
            flags: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc and OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
      - run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            flags: ""
          - name: public
            flags: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc and OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Unit tests plus the offline MCP protocol tests. Live canaries are
      # #[ignore] and only run from canary.yml.
      - run: cargo nextest run --profile ci ${{ matrix.flags }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; no CODECOV_TOKEN secret needed on a public repo
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc and OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      # The integration tests spawn the (instrumented) binary, so handler code
      # in server.rs is counted too, not only the fixture-driven parsers.
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --profile ci --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: HTML report
        run: cargo llvm-cov report --html --output-dir target/llvm-cov/html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc and OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --all-targets --locked
      - run: cargo check --all-targets --locked --no-default-features

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A new RustSec advisory shouldn't turn every open PR red. The job still
    # fails visibly; license, ban and source violations do block.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
