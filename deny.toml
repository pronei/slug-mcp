# cargo-deny policy: `cargo deny check` locally, the `deny` job in CI.

[graph]
# Check the auth feature's dependency tree (chromiumoxide, aes-gcm) too.
all-features = true

[advisories]
# Add RUSTSEC ids here, each with a reason, only when an advisory doesn't apply.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
